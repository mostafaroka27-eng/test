name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release on the default branch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared core tests (same project file format as the iPhone app)
        run: ./gradlew :core:test --console=plain

      - name: Build the installable APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoomScanInspector-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoomScanInspector-android-apk
          path: android/RoomScanInspector-android.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/core/build/reports/tests/

      # On the default branch, also attach the APK to a release so it can be
      # downloaded straight from a phone or tablet browser (no GitHub login,
      # no zip) when the repository is public, or by any signed-in member.
      - name: Publish "android-latest" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android – latest build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of ${{ github.sha }}.
            Install: download RoomScanInspector-android.apk on the phone or tablet, open it, allow "Install unknown apps" for your browser or Files app when asked.
          files: android/RoomScanInspector-android.apk
