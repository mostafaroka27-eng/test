# XcodeGen spec equivalent to the committed RoomScanInspector.xcodeproj.
# Optional: `brew install xcodegen && xcodegen generate` regenerates the project.
name: RoomScanInspector
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  InspectionCore:
    path: Packages/InspectionCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  RoomScanInspector:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: InspectionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.roomscaninspector
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  RoomScanInspectorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: RoomScanInspector
      - package: InspectionCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.roomscaninspector.tests
schemes:
  RoomScanInspector:
    build:
      targets:
        RoomScanInspector: all
    test:
      targets:
        - RoomScanInspectorTests
        - package: InspectionCore/InspectionCoreTests
